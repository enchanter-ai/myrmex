name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm test
      - run: npm run build
      - run: npm run bench
      - name: smoke test the built service
        run: |
          node dist/service/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8080/health
          curl -sf -X POST http://localhost:8080/score \
            -H 'content-type: application/json' \
            -d '{"response":{"status":200,"headers":{},"body":"<html><body>Sorry, you have been blocked. Cloudflare Ray ID: 8f1</body></html>"}}'
          kill $SERVER_PID
